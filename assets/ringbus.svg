<text x="480" y="80" text-anchor="middle" font-size="13" fill="#333">Jeder Melder hat eine eigene Adresse → Einzelmelder­erkennung („Meldergruppe/Melder“, z. B. 1/3).</text>
<text x="480" y="100" text-anchor="middle" font-size="13" fill="#333">Unterbrechung → BMZ versorgt beide Ringhälften von zwei Seiten → nur <tspan font-weight="bold">Störung</tspan>, kein Ausfall.</text>
<text x="480" y="120" text-anchor="middle" font-size="13" fill="#333">Kurzschluss → Trennelemente (■) links und rechts schalten den Abschnitt ab → Rest bleibt in Betrieb.</text>
<line x1="520" y1="150" x2="540" y2="170" stroke="#000" stroke-width="3"/><line x1="540" y1="150" x2="520" y2="170" stroke="#000" stroke-width="3"/>
<text x="530" y="140" text-anchor="middle" font-size="11" fill="#000">Drahtbruch</text>
<text x="20" y="345" font-size="11.5" fill="#555">Regel (DIN VDE 0833-2): Bei einem Fehler auf dem Übertragungsweg dürfen nicht mehr als 32 Melder bzw. ein Meldebereich ausfallen → Trennelemente.</text>
